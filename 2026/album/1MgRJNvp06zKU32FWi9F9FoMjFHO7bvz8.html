.mytitle{

.gallery-container {

@media (max-width: 768px) {

.gallery-item {
	position: relative;
	cursor: pointer;

	overflow: hidden;
	border-radius: 12px;

	transition: transform .3s ease,box-shadow .3s ease;
}

.gallery-item:hover {
	transform: translateY(-5px);
	box-shadow: 0 8px 25px #0000004d;
}

.gallery-item img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	transition: transform .3s ease;
}

.gallery-item:hover img {
	transform: scale(1.05);
}
