<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
    body{background-color:$bodybg$;}
    .wrap-content{
margin:0 auto;
padding:5px;
    max-width:1200px;
    }


    
.mytitle{
    background-color:#737509;
    background-color:$primary$;
    color:#fff;
    border-radius: 12px 12px 0 0;
    margin-bottom:0;
    padding:10px;
    text-align:center;
    border-bottom: 2px solid $aksen$;
}
.mysubtitle{
    background-color:#737509;
    background-color:$secondary$;
    color:#000;
    border-radius: 0 0 12px 12px;
    margin-top:0;
    padding:10px;
    text-align:left;
}
.gallery-container {
	display: grid;
	grid-template-columns: repeat(4,1fr);
	gap: 5px;
	max-width: 1200px;
	margin: 0 auto;
}

@media (max-width: 1024px) {
	.gallery-container {
		grid-template-columns: repeat(3,1fr);
	}
}

@media (max-width: 768px) {
	.gallery-container {
		grid-template-columns: repeat(2,1fr);
	}
}


.gallery-item {
	position: relative;
	cursor: pointer;
	aspect-ratio: 4 / 3;
	overflow: hidden;
	border-radius: 12px;
	box-shadow: 0 4px 15px #0003;
	transition: transform .3s ease,box-shadow .3s ease;
}

.gallery-item:hover {
	transform: translateY(-5px);
	box-shadow: 0 8px 25px #0000004d;
}

.gallery-item img {
	width: 100%;
	height: 100%;
	object-fit: cover;
	transition: transform .3s ease;
}

.gallery-item:hover img {
	transform: scale(1.05);
}


</style>
</head>
<body>
<div class="wrap-content">
<h3 class="mytitle">Bimbingan Belajar Matematika</h3>
<p class="mysubtitle">Dokumentasi Urusan Pendidikan</p>
<div class="gallery-container" id="gallery-container">

<div class="gallery-item">
<a href="https://drive.google.com/file/d/1K7QJwBqN4rsJePA3mcAjHB_B7bCtM7ZK/view?usp=drive_link"><img alt=""src="https://drive.google.com/thumbnail?id=1K7QJwBqN4rsJePA3mcAjHB_B7bCtM7ZK"/></a>
</div>
<div class="gallery-item">
<a href="https://drive.google.com/file/d/1yKHky4wk0xUE0gpjDPohOKibjlOpy4Rk/view?usp=drive_link"><img alt=""src="https://drive.google.com/thumbnail?id=1yKHky4wk0xUE0gpjDPohOKibjlOpy4Rk"/></a>
</div>
<div class="gallery-item">
<a href="https://drive.google.com/file/d/1DRxtDjKQpdILubyjwy5FSuKY-yGrSsJ9/view?usp=drive_link"><img alt=""src="https://drive.google.com/thumbnail?id=1DRxtDjKQpdILubyjwy5FSuKY-yGrSsJ9"/></a>
</div>
</div>
</div>
</body>
</html>
